ServerTokens Prod
ServerSignature Off

<Directory /var/www/html>
    Options -Indexes +FollowSymLinks
    AllowOverride All
    Require all granted
    AcceptPathInfo On
    DirectoryIndex index.php index.html
</Directory>

# KeepAlive tuning for high concurrency behind Caddy reverse proxy
KeepAlive On
MaxKeepAliveRequests 500
KeepAliveTimeout 5
