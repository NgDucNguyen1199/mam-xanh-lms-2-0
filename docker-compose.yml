# ===================================================================
# Mầm Xanh LMS 2.0 - Production Turbo Docker Compose Architecture
# ===================================================================
services:
  moodle_db:
    image: mariadb:10.11
    container_name: moodle_db
    restart: unless-stopped
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --innodb-buffer-pool-size=512M
      - --innodb-flush-log-at-trx-commit=2
      - --skip-name-resolve
      - --max-connections=200
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-MX!RootDb2026}
      MYSQL_DATABASE: ${MOODLE_DB_NAME:-moodle_mamxanh}
      MYSQL_USER: ${MOODLE_DB_USER:-moodle_user}
      MYSQL_PASSWORD: ${MOODLE_DB_PASS:-MX!DbPass2026}
      TZ: Asia/Ho_Chi_Minh
    volumes:
      - mariadb_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - mamxanh_net

  moodle_redis:
    image: redis:7-alpine
    container_name: moodle_redis
    restart: unless-stopped
    command: ["redis-server", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - mamxanh_net

  moodle_app:
    build:
      context: .
      dockerfile: Dockerfile
    image: mamxanh-moodle:2.0
    container_name: moodle_app
    restart: unless-stopped
    depends_on:
      moodle_db:
        condition: service_healthy
      moodle_redis:
        condition: service_healthy
    environment:
      MOODLE_DB_HOST: moodle_db
      MOODLE_DB_NAME: ${MOODLE_DB_NAME:-moodle_mamxanh}
      MOODLE_DB_USER: ${MOODLE_DB_USER:-moodle_user}
      MOODLE_DB_PASS: ${MOODLE_DB_PASS:-MX!DbPass2026}
      MOODLE_WWWROOT: ${MOODLE_WWWROOT:-https://moodle.lvh.me:8443}
      REDIS_HOST: moodle_redis
      REDIS_PORT: 6379
      MAMXANH_HMAC_SECRET: ${MAMXANH_HMAC_SECRET:-MX2_HMAC_2026_VIETGAP_AGRITECH_DIGITAL_SIGNATURE_KEY}
      TZ: Asia/Ho_Chi_Minh
    tmpfs:
      - /tmp:rw,nosuid,size=512m
    volumes:
      - moodle_data:/var/moodledata
      - ./moodle_custom/config.php:/var/www/html/config.php:ro
      - ./moodle_custom/local/mamxanhapp:/var/www/html/local/mamxanhapp
      - ./moodle_custom/local/farmerprofile:/var/www/html/local/farmerprofile
      - ./moodle_custom/local/agriops:/var/www/html/local/agriops
      - ./moodle_custom/local/mamxanhcert:/var/www/html/local/mamxanhcert
      - ./moodle_custom/mod/fieldpractice:/var/www/html/mod/fieldpractice
      - ./moodle_custom/theme/agritrain_child:/var/www/html/theme/agritrain_child
      - ./moodle_custom/pwa/manifest.json:/var/www/html/manifest.json:ro
      - ./moodle_custom/pwa/sw.js:/var/www/html/sw.js:ro
      - ./moodle_custom/pwa/offline.html:/var/www/html/offline.html:ro
      - ./moodle_custom/pwa/icons:/var/www/html/pwa-icons
      - ./scripts:/opt/mamxanh/scripts
      - ./backups:/opt/mamxanh/backups
    networks:
      - mamxanh_net

  moodle_cron:
    build:
      context: .
      dockerfile: Dockerfile
    image: mamxanh-moodle:2.0
    container_name: moodle_cron
    restart: unless-stopped
    depends_on:
      moodle_app:
        condition: service_started
    environment:
      MOODLE_DB_HOST: moodle_db
      MOODLE_DB_NAME: ${MOODLE_DB_NAME:-moodle_mamxanh}
      MOODLE_DB_USER: ${MOODLE_DB_USER:-moodle_user}
      MOODLE_DB_PASS: ${MOODLE_DB_PASS:-MX!DbPass2026}
      MOODLE_WWWROOT: ${MOODLE_WWWROOT:-https://moodle.lvh.me:8443}
      REDIS_HOST: moodle_redis
      REDIS_PORT: 6379
      MAMXANH_HMAC_SECRET: ${MAMXANH_HMAC_SECRET:-MX2_HMAC_2026_VIETGAP_AGRITECH_DIGITAL_SIGNATURE_KEY}
      TZ: Asia/Ho_Chi_Minh
    tmpfs:
      - /tmp:rw,nosuid,size=256m
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        mkdir -p /tmp/moodle_localcache /tmp/moodle_temp
        chown -R www-data:www-data /tmp/moodle_localcache /tmp/moodle_temp
        echo "[moodle_cron] Started 60-second Moodle cron scheduler."
        while true; do
          if [ -f /var/moodledata/.installed ]; then
            su -s /bin/bash www-data -c "php /var/www/html/admin/cli/cron.php >/dev/null 2>&1 || true"
          fi
          sleep 60
        done
    volumes:
      - moodle_data:/var/moodledata
      - ./moodle_custom/config.php:/var/www/html/config.php:ro
      - ./moodle_custom/local/mamxanhapp:/var/www/html/local/mamxanhapp
      - ./moodle_custom/local/farmerprofile:/var/www/html/local/farmerprofile
      - ./moodle_custom/local/agriops:/var/www/html/local/agriops
      - ./moodle_custom/local/mamxanhcert:/var/www/html/local/mamxanhcert
      - ./moodle_custom/mod/fieldpractice:/var/www/html/mod/fieldpractice
      - ./moodle_custom/theme/agritrain_child:/var/www/html/theme/agritrain_child
      - ./scripts:/opt/mamxanh/scripts
      - ./backups:/opt/mamxanh/backups
    networks:
      - mamxanh_net

  moodle_proxy:
    image: caddy:2-alpine
    container_name: moodle_proxy
    restart: unless-stopped
    depends_on:
      - moodle_app
    ports:
      - "${HTTPS_PORT:-8443}:8443"
      - "${HTTP_PORT:-8080}:8080"
    volumes:
      - ./docker/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      mamxanh_net:
        aliases:
          - moodle.lvh.me

volumes:
  mariadb_data:
  moodle_data:
  caddy_data:
  caddy_config:

networks:
  mamxanh_net:
    driver: bridge
